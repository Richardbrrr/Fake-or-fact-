const C=[
{c:"Geschichte",s:"Kleopatra lebte zeitlich näher an der Mondlandung (1969) als am Bau der Cheops-Pyramide.",a:"fact",e:"Die Cheops-Pyramide entstand um 2560 v. Chr., Kleopatra VII. starb 30 v. Chr. – rund 2.500 Jahre Abstand. Bis zur Mondlandung 1969 sind es nur etwa 2.000 Jahre. Es klingt falsch, ist aber richtig: Bauchgefühl ersetzt keine Rechnung.",v:"Jahreszahlen nachschlagen und selbst rechnen.",q:"Enzyklopädie (z. B. Britannica) oder Museumsseiten",n:"Die Bauzeit der Cheops-Pyramide ist nur auf einige Jahrzehnte genau bekannt (grob um 2580–2560 v. Chr., je nach Quelle). Das ändert nichts am Ergebnis: Der Abstand zur Pyramide ist rund 500 Jahre größer als der zur Mondlandung."},
{c:"Wissenschaft",s:"Botanisch gesehen ist eine Banane eine Beere – eine Erdbeere dagegen nicht.",a:"fact",e:"Eine Beere hat eine fleischige Fruchtwand und mehrere Samen im Inneren – das trifft botanisch auf die Banane zu (Wildformen haben Samen, Kulturbananen sind samenlos gezüchtet). Die Erdbeere ist eine Sammelnussfrucht, die „Samen“ außen sind kleine Nüsschen. Alltagssprache und Botanik benutzen dieselben Wörter unterschiedlich.",v:"Die botanische Definition von „Beere“ nachlesen.",q:"Botanik-Lehrbuch oder Universitätslexikon"},
{c:"Geschichte",s:"Napoleon Bonaparte war mit nur etwa 1,57 m deutlich kleiner als die meisten Männer seiner Zeit.",a:"fake",e:"Er war etwa 1,69 m groß, also durchschnittlich. Sein Arzt notierte „5 pieds 2 pouces“ – alte französische Maße, die länger waren als englische Fuß und Zoll. Der Irrtum entstand durch die falsche Umrechnung und durch britische Karikaturen.",v:"Mehrere unabhängige Quellen vergleichen und auf Maßeinheiten achten.",q:"Biografien von Historikern, Enzyklopädien",u:[["https://britannica.com/topic/Napoleon-as-Pop-Culture-Icon","Britannica: Napoleon as Pop Culture Icon","Nennt die Messung seines Arztes in französischen Maßen und vergleicht seine Größe mit Zeitgenossen."]],n:"Je nach Umrechnung werden etwa 1,67–1,69 m genannt. Der genaue Zentimeterwert ist unsicher, die Einordnung „durchschnittlich“ nicht.",t:"LLM: Mythen, die in vielen Texten stehen, wiederholt ein Sprachmodell leicht – Häufigkeit ist kein Beweis."},

{c:"Technik",s:"Das Wort „Algorithmus“ geht auf den Namen des persischen Gelehrten al-Chwarizmi (9. Jahrhundert) zurück.",a:"fact",e:"Muhammad ibn Musa al-Chwarizmi schrieb ein Rechenbuch; in der lateinischen Übersetzung wurde sein Name zu „Algoritmi“. Heute heißt Algorithmus: feste Abfolge von Regeln und Rechenschritten.",v:"Wortherkunft in einem etymologischen Wörterbuch prüfen.",q:"Duden, Etymologisches Wörterbuch",u:[["https://www.britannica.com/biography/al-Khwarizmi","Britannica: al-Khwarizmi","Sein Rechenbuch ist nur in lateinischer Übersetzung erhalten; sein latinisierter Name „Algoritmi“ führte zum Wort „Algorithmus“."]],t:"Algorithmus: Auch eine KI ist ein riesiger Ablauf aus Rechenschritten – aber ohne eingebaute Wahrheitsprüfung."},
{c:"Prominente",s:"Albert Einstein erhielt den Nobelpreis für Physik für seine Relativitätstheorie.",a:"fake",e:"Er bekam ihn (für 1921, verliehen 1922) für die Erklärung des photoelektrischen Effekts. Die offizielle Begründung nennt die Relativitätstheorie nicht.",v:"Die Preisbegründung auf der offiziellen Seite nachlesen.",q:"nobelprize.org",u:[["https://www.nobelprize.org/prizes/physics/1921/summary/","Nobelpreis Physik 1921 (nobelprize.org)","Offizielle Preisbegründung: Verdienste um die theoretische Physik, besonders die Entdeckung des Gesetzes des photoelektrischen Effekts."]],t:"LLM: Es wählt das wahrscheinlichste Wort – nicht das geprüfte. Einstein und Relativität werden sehr oft zusammen genannt."},
{c:"Wissenschaft",s:"Ein Blitz kann mehrmals an derselben Stelle einschlagen – das Empire State Building wird mehrfach pro Jahr getroffen.",a:"fact",e:"Hohe, spitze Objekte sind bevorzugte Einschlagorte und werden immer wieder getroffen. Das Sprichwort „Der Blitz schlägt nie zweimal am selben Ort ein“ ist ein Mythos.",v:"Aussagen von Wetterdiensten und Physik-Lexika vergleichen.",q:"Deutscher Wetterdienst (DWD), NOAA",u:[["https://www.weather.gov/safety/lightning-myths","NOAA / National Weather Service: Lightning Myths and Facts","Widerlegt das Sprichwort; nennt das Empire State Building als Beispiel (im Schnitt etwa 23 Treffer pro Jahr)."]],n:"Die Trefferzahl wird je nach Quelle verschieden angegeben (etwa 20–25 pro Jahr, manche Seiten nennen mehr). „Mehrfach pro Jahr“ ist in jedem Fall belegt."},
{c:"Aktuelle Informationen",s:"Ein Chatbot ohne Internetzugriff antwortet selbstsicher: „Aktuell führt der FC Bayern München die Bundesliga-Tabelle mit 24 Punkten an.“",a:"check",e:"Ob das stimmt, hängt vom heutigen Tag ab. Ein Modell kennt nur Daten bis zu seinem Knowledge Cutoff – und klingt bei veralteten Infos genauso sicher wie bei aktuellen. Bei Tabellen, Preisen oder Nachrichten gilt: immer überprüfen.",v:"Die aktuelle Tabelle bei einer Live-Quelle nachsehen.",q:"bundesliga.com, DFL oder Kicker",u:[["https://www.bundesliga.com/","Bundesliga.com (Startseite, dort die Tabelle suchen)","Nur eine Live-Quelle zeigt den heutigen Tabellenstand. Eine Detailseite wurde nicht geprüft."]],n:"Informationsstand: Die Aussage ist zeitabhängig. Darum gibt es hier bewusst keine feste Lösung „wahr“ oder „falsch“.",t:"Knowledge Cutoff: Was danach passiert ist, kennt das Modell nicht – es sei denn, es sucht live im Netz."},

<div class="row"><button class="b o" onclick="home()">Zurück</button><button class="b o" onclick="printpage()">🖨️ Druckansicht</button><button class="b" onclick="mission()">Digital starten</button></div>
</section>`)}
const srcHTML=x=>`<p><b>Zum Überprüfen:</b> ${x.q}</p>`+(x.u?`<ul class="src">${x.u.map(u=>`<li><a href="${u[0]}" target="_blank" rel="noopener noreferrer">${u[1]}</a><br><span class="tg">Belegt: ${u[2]}</span></li>`).join("")}</ul><p class="tg">Links am ${VDATE} per Suche gefunden; zum Öffnen ist Internet nötig, Seiten können sich ändern.</p>`:`<p class="tg">Kein geprüfter Direktlink – bitte die genannte Quelle selbst suchen.</p>`)+(x.n?`<p class="unsure"><b>Unsicherheit / Informationsstand:</b> ${x.n}</p>`:"");
function mission(){reset();go(`<section class="in"><p class="k">Deine Mission</p><h2>Finde heraus, was Fakt ist und was nur so klingt.</h2><p>Du bekommst ${C.length} Aussagen. Entscheide: <b>FAKT</b>, <b>FAKE</b> oder <b>ÜBERPRÜFEN</b>, wenn man es so nicht sicher sagen kann. Erst danach siehst du die Auflösung. Tippe zuerst die ${T.length} Begriffe an:</p>${infobox()}<div class="card"><h2>Warum erfindet eine KI Dinge?</h2><p>Ein LLM besitzt nicht automatisch ein menschliches Verständnis von Wahrheit. Es erzeugt Wort für Wort, was wahrscheinlich passt – und kann dadurch überzeugende Antworten liefern, die falsch oder erfunden sind. Das nennt man <b>Halluzination</b>.</p><p class="big">Eine überzeugend klingende Antwort ist nicht automatisch eine wahre Antwort.</p><p class="big">Vertrauen ≠ Überprüfen</p></div>${ptsCard()}<button class="b" onclick="show()">Karte 1 starten</button></section>`)}
function show(){seq[n]=="P"?pr():cardv()}
function cardv(){const i=seq[n],x=C[i];ch=null;go(`${hud()}<section class="card in"><p class="k">Karte ${i+1} · ${x.c}</p><p class="st">${x.s}</p><div class="row" role="group" aria-label="Deine Antwort">${["fact","fake","check"].map(k=>`<button class="ch" data-v="${k}" aria-pressed="false" onclick="pick('${k}')">${I[k]}</button>`).join("")}</div><div id="why" hidden><label class="k" for="tx" style="display:block;margin-top:16px">Deine Begründung (ein Satz genügt)</label><textarea id="tx" oninput="chk()" placeholder="Woran erkennst du das?"></textarea><div class="row"><button class="b" id="rv" onclick="reveal()" disabled>Auflösung anzeigen</button></div></div></section><div id="out"></div>`)}
function pick(k){if(R[seq[n]])return;ch=k;document.querySelectorAll(".ch").forEach(b=>{const on=b.dataset.v==k;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});$("why").hidden=false;chk()}
function chk(){$("rv").disabled=!(ch&&$("tx").value.trim().length>=4)}
function reveal(){const i=seq[n],x=C[i];if(R[i]||!ch)return;const ok=ch==x.a,p=ok?P[x.a]:0;R[i]={pick:ch,ok,pts:p,bon:0,sc:0};
document.querySelectorAll(".ch,#tx").forEach(e=>e.disabled=true);$("rv").hidden=true;$("sc").textContent=sum()+" Punkte";
$("out").innerHTML=`<div class="card res ${ok?"ok":"no"}"><h2>${ok?"Richtig! +"+p+(p>1?" Punkte":" Punkt"):"Nicht ganz!"}</h2><p>Lösung: <b>${I[x.a]}</b>${ok?"":" – du hast "+L[ch]+" gewählt."}</p><p><b>Belegte Fakten und Einordnung:</b> ${x.e}</p><p><b>So prüfst du es:</b> ${x.v}</p>${srcHTML(x)}${x.t?`<p class="tg">🔗 ${x.t}</p>`:""}<p class="tg">Passende Lösungskarte in der Box: ${kid(i)}</p><p><b>Selbst-Check (+${BONUS} Punkt):</b> Hat deine Begründung den Kernpunkt getroffen? Das ist deine ehrliche Selbsteinschätzung.</p><div class="row"><button class="b o" id="s1" onclick="selfchk(1)">Ja, Kernpunkt getroffen</button><button class="b o" id="s0" onclick="selfchk(0)">Nein oder teilweise</button></div><p id="sm" class="tg" role="status"></p><div class="row"><button class="b" onclick="nxt()">${n==seq.length-1?"Zum Ergebnis":"Weiter"}</button></div></div>`;
$("out").scrollIntoView({behavior:"smooth",block:"nearest"})}
function selfchk(v){const r=R[seq[n]];if(!r||r.sc)return;r.sc=1;r.bon=v*BONUS;$("s1").disabled=true;$("s0").disabled=true;$("sm").textContent=v?"+"+BONUS+" Punkt für dein Verständnis.":"Kein Bonus – lies den Kernpunkt oben noch einmal.";$("sc").textContent=sum()+" Punkte"}
function nxt(){const i=seq[n];if(i=="P"?!pp.done:!R[i])return;n++;n<seq.length?show():end()}

const BAD="Ist diese Aussage wahr?",GOOD="Prüfe kritisch diese Behauptung: „Menschen nutzen nur 10 % ihres Gehirns.“\nSag mir, ob sie nach dem Stand der Wissenschaft stimmt, und erkläre es in einfachen Worten.\nNenne Quellen oder Suchbegriffe, mit denen ich es selbst überprüfen kann.\nSag ausdrücklich, wo du unsicher bist oder etwas nicht wissen kannst, und erfinde keine Quellen.";
const CHK=["Nennt die KI überprüfbare Quellen?","Sind die Quellen tatsächlich auffindbar?","Stimmen die Angaben mit unabhängigen, seriösen Quellen überein?","Gibt die KI Unsicherheiten zu?","Könnte die KI Informationen erfunden oder falsch miteinander verbunden haben?"];
const rad=(n,o)=>o.map(t=>`<label class="rd"><input type="radio" name="${n}" value="${t}">${t}</label>`).join("");
function pr(){go(`${hud()}<section class="card in"><p class="k">Prompt-Challenge · optional mit echter KI</p><h2>Wie prüfst du eine KI-Antwort?</h2><p>Diese Seite enthält <b>keine eingebaute KI</b>. Du formulierst hier einen Prompt, kannst ihn in einem KI-Chat in einem anderen Fenster ausprobieren und die Antwort danach selbst bewerten. Ohne KI-Zugang gehst du die Beispiele durch oder gehst direkt weiter.</p>${navigator.onLine?"":`<p><span class="tag">Offline</span> Du kannst den Prompt kopieren und später mit Internet testen. Alles andere hier funktioniert weiter.</p>`}
<h2>Was macht einen guten Prompt aus?</h2><p>Ein guter Prompt nennt <b>die Behauptung</b>, den <b>Maßstab</b> (kritisch prüfen), den <b>Wunsch nach Quellen</b> und die Bitte, <b>Unsicherheit offen zu sagen</b>. So kannst du die Antwort leichter nachprüfen.</p>
<div class="pcs"><div class="pc bad"><h3>❌ Schwacher Prompt</h3><p>„${BAD}“</p><p class="tg">Keine Behauptung, kein Maßstab, keine Quellen, keine Bitte um Unsicherheit.</p></div><div class="pc good"><h3>✅ Besserer Prompt</h3><p style="white-space:pre-line">${GOOD}</p><p class="tg">Behauptung, Maßstab, Quellenwunsch und Unsicherheit sind enthalten.</p></div></div>
<div class="bx-call"><p><b>Zwei getrennte Fragen:</b> (1) Wie gut ist dein <i>Prompt</i>? (2) Ist die <i>Antwort</i> wahr? Ein guter Prompt macht eine Antwort besser prüfbar, aber nicht wahr. Das erfährst du nur durch eigene Prüfung mit unabhängigen Quellen. Auch mit gutem Prompt kann eine KI Quellen erfinden oder Fakten falsch verbinden.</p></div>
<h2>1 · Dein eigener Prompt</h2><p>Behauptung zum Üben: <b>„Menschen nutzen nur 10 % ihres Gehirns.“</b> Schreibe einen eigenen Prompt dazu oder setze das Beispiel ein und ändere es.</p><label class="k" for="pt" style="display:block">Dein Prompt</label><textarea id="pt" placeholder="Formuliere hier deinen Prompt …"></textarea>
<div class="row"><button class="b o" onclick="$('pt').value=GOOD;say('Beispiel-Prompt eingesetzt')">Besseren Beispiel-Prompt einsetzen</button><button class="b" onclick="cp()" id="cb">Prompt kopieren</button><button class="b o" onclick="test()">Prompt-Check (Stichwörter)</button></div><p id="cpm" class="tg" role="status"></p><div id="out"></div>
<h2>2 · Optional: in einer echten KI ausprobieren</h2><ol><li>Öffne in einem anderen Tab oder einer anderen App einen KI-Chat, den du nutzen darfst. Gib keine persönlichen Daten ein.</li><li>Füge deinen Prompt ein und sende ihn ab.</li><li>Lies die Antwort und suche genannte Quellen selbst heraus.</li></ol>
<h2>3 · Deine Beobachtung der KI-Antwort</h2><p class="tg">Das ist deine eigene Einschätzung. Die Seite bewertet sie nicht, vergibt dafür keine Punkte und speichert sie nicht.</p><label class="k" for="ai" style="display:block">Was hat die KI geantwortet? (kurz zusammenfassen)</label><textarea id="ai" placeholder="Hier steht, was die KI geantwortet hat – oder: Ich habe keine KI genutzt."></textarea>
<fieldset><legend>Hat die KI Quellen genannt?</legend>${rad("q1",["Ja","Nein","Keine KI genutzt"])}</fieldset><fieldset><legend>Waren die Quellen überprüfbar (von dir gefunden oder geöffnet)?</legend>${rad("q2",["Ja","Teilweise","Nein","Nicht geprüft"])}</fieldset><fieldset><legend>Hat die KI Unsicherheiten kenntlich gemacht?</legend>${rad("q3",["Ja","Nein","Keine KI genutzt"])}</fieldset>
<h2>Checkliste zur kritischen Bewertung</h2>${CHK.map(q=>`<label class="cl"><input type="checkbox"><span>${q}</span></label>`).join("")}
<details class="card"><summary>Beispielantworten ansehen (vorgefertigt, keine echte KI)</summary><p class="k">SIMULATION · von uns geschriebene Texte, nicht von einer KI erzeugt</p><div class="sim"><b>So könnte eine Antwort auf den schwachen Prompt aussehen:</b><br>„Ja, das stimmt. Menschen nutzen tatsächlich nur etwa 10 % ihres Gehirns.“ (falsch, aber selbstsicher)</div><div class="sim"><b>So könnte eine Antwort auf den besseren Prompt aussehen:</b><br>Das ist ein verbreiteter Mythos. Bildgebende Verfahren (z. B. fMRT) zeigen, dass praktisch alle Hirnregionen genutzt werden, nur nicht alle gleichzeitig gleich stark. Unsicher ist, was „nutzen“ genau heißt. Zum Überprüfen: Lehrbücher der Neurowissenschaft, Übersichtsartikel (z. B. über PubMed), Fachgesellschaften.</div><p>Übung: Welche Beispielantwort lässt sich besser überprüfen – und woran erkennst du das?</p><p class="tg">Zum Selbstprüfen der Behauptung: <a href="https://www.bmj.com/content/335/7633/1288" target="_blank" rel="noopener noreferrer">Vreeman &amp; Carroll, „Medical myths“, BMJ 2007;335:1288</a> (behandelt den 10-%-Mythos; Link am ${VDATE} per Suche gefunden, Internet nötig).</p></details>
<div class="row"><button class="b" id="pw" onclick="fin()">Weiter zu Karte ${PROMPT_AFTER+1}</button></div></section>`)}
async function cp(){const v=$("pt").value;let ok=false;try{await navigator.clipboard.writeText(v);ok=true}catch(e){try{$("pt").select();ok=document.execCommand("copy")}catch(e2){}}
const m=ok?"Kopiert! Füge den Prompt jetzt in dein KI-Fenster ein.":"Kopieren nicht möglich. Markiere den Text und kopiere ihn von Hand (Strg+C oder lange tippen).";$("cpm").textContent=m;say(m)}
function pchk(){const v=$("pt").value.toLowerCase(),r=PK.map(k=>k[1].test(v));return{r,c:v.length>20?r.filter(Boolean).length:0}}
function test(){if(pp.done)return;const{r,c}=pchk();pp.best=Math.max(pp.best,c);
$("out").innerHTML=`<div class="card res ${c>=2?"ok":"no"}"><h2>Prompt-Check: ${c} von ${PROMPT_MAX} Kriterien</h2>${PK.map((k,i)=>`<p class="ck ${r[i]?"y":"n"}">${r[i]?"✔":"✘"} ${k[0]}</p>`).join("")}<p class="tg">Der Check sucht nur Stichwörter in deinem Prompt. Er bewertet weder die Wahrheit der Behauptung noch eine echte KI-Antwort. Punkte gibt es nur für die Formulierung; der beste Versuch (${pp.best}) zählt einmal, wenn du weitergehst.</p></div>`;$("pw").textContent=`Weiter (+${pp.best} Punkte)`}
function fin(){if(pp.done)return;pp.best=Math.max(pp.best,pchk().c);pp.done=true;pp.pts=pp.best;nxt()}
function doPrint(){try{window.print()}catch(e){say("Drucken nicht möglich. Nutze die Druckfunktion deines Browsers (Strg+P oder Teilen → Drucken).")}}
async function cpAll(){const t=RQ.map((q,i)=>q+"\n"+(($("rq"+i)||{}).value||"")).join("\n\n");let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){}
const m=ok?"Antworten kopiert.":"Kopieren nicht möglich. Markiere deine Antworten und kopiere sie von Hand oder nutze den Druckdialog (Strg+P).";$("rcm").textContent=m;say(m)}
function end(){const rs=Object.values(R),kp=rs.reduce((a,r)=>a+r.pts,0),bp=rs.reduce((a,r)=>a+r.bon,0),right=rs.filter(r=>r.ok).length,tot=sum();
/* Ranglisten-Schwellen als Anteil der Maximalpunktzahl: bis 25 %, bis 60 %, bis 85 %, darüber. */
const q=tot/MAX,r=q<=.25?["KI-Anfänger","Zeit für den Faktencheck!"]:q<=.6?["Fact Checker","schon ziemlich gut!"]:q<=.85?["KI-Detektiv","starke Arbeit!"]:["Fact-Check-Profi","du glaubst nicht alles, was eine KI sagt!"];
go(`<section class="in"><p class="k">Ergebnis</p><div class="card" style="text-align:center"><div class="sc">${tot}</div><p>von maximal ${MAX} Punkten · ${right} von ${C.length} Karten richtig</p><h2>${r[0]} – ${r[1]}</h2></div><div class="card"><h2>So entsteht dein Ergebnis</h2><p>Karten: ${kp} von ${KMAX} · Selbst-Check: ${bp} von ${C.length*BONUS} · Prompt-Challenge: ${pp.pts} von ${PROMPT_MAX}</p><p class="tg">Maximum = ${KMAX} + ${C.length*BONUS} + ${PROMPT_MAX} = ${MAX}. Stufen nach Anteil an dieser Höchstzahl: bis 25 % KI-Anfänger, bis 60 % Fact Checker, bis 85 % KI-Detektiv, darüber Fact-Check-Profi (du: ${Math.round(q*100)} %). Wichtiger als die Punkte ist, ob du erklären kannst, warum eine Aussage stimmt, falsch ist oder erst geprüft werden muss.</p>${seq.filter(x=>x!="P").map(i=>`<p class="ck ${R[i].ok?"y":"n"}">${R[i].ok?"✔":"✘"} Karte ${i+1} (${kid(i)}): ${L[C[i].a]}${R[i].ok?"":" – du: "+L[R[i].pick]}</p>`).join("")}</div><div class="card"><p class="big">Eine überzeugend klingende Antwort ist nicht automatisch eine wahre Antwort.</p><p class="big">Vertrauen ≠ Überprüfen</p><p>KI kann beim Finden und Erklären helfen. Wichtige Informationen solltest du kritisch prüfen und mit mehreren unabhängigen, zuverlässigen Quellen vergleichen.</p></div><div class="card"><p class="k">Reflexion (freiwillig, ohne Punkte)</p><h2>Reflexion</h2>${RQ.map((t,i)=>`<label for="rq${i}"><b>${t}</b></label><textarea id="rq${i}"></textarea>`).join("")}<p class="tg">Deine Antworten werden nicht gespeichert. Kopiere sie, wenn du sie behalten willst.</p><div class="row"><button class="b o" onclick="cpAll()">Antworten kopieren</button><button class="b" onclick="document.getElementById('mk').hidden=false;this.hidden=true">Mit den Merksätzen vergleichen</button></div><p id="rcm" class="tg" role="status"></p><div id="mk" hidden><p><b>1.</b> Überraschung ist ein Signal: Dein Bauchgefühl ist kein Beweis, und eine Halluzination klingt genauso sicher wie ein Fakt.</p><p><b>2.</b> Prüfbedarf besteht bei sehr genauen Zahlen, Zitaten berühmter Personen, Quellenangaben ohne Link, Wörtern wie „immer“ und bei Aktuellem (Knowledge Cutoff).</p><p><b>3.</b> Quelle selbst öffnen, mindestens zwei unabhängige seriöse Quellen vergleichen, Datum und Kontext lesen – und nichts ungeprüft weitergeben.</p><p><b>4.</b> Ein besserer Prompt verlangt kritisches Prüfen, Unsicherheiten, überprüfbare Quellen und „erfinde nichts“. Eine Garantie ist das nicht.</p></div></div><button class="b" onclick="home()">Nochmal spielen</button></section>`)}
home();
</script></body></html>
